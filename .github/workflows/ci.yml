name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/oracle -p 'test_*.py' -v
      - name: Fixture is up to date with the oracle
        run: |
          python tools/oracle/generate.py
          git diff --exit-code -- src/engine/__fixtures__/conformance-app.json
      - name: Quiz golden file is up to date with the oracle
        run: |
          python tools/oracle/quiz_golden.py
          git diff --exit-code -- src/quiz/__fixtures__/weights-golden.json
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0 # the supabase devDependency in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: supabase start
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:integration
